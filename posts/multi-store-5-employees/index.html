<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매장 2곳 직원 총 6명, 상시 5인 이상일까? ｜ 카드뉴스 뷰어</title>
  <style>
    :root {
      --primary: #0e7490;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    header { text-align: center; max-width: 600px; margin-bottom: 30px; }
    header .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(14, 116, 144, 0.25);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 { font-size: 26px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
    p.desc { font-size: 15px; color: var(--text-muted); line-height: 1.5; }
    .viewer-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .slider {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .slider::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 100%;
      width: 100%;
      aspect-ratio: 1 / 1;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card-bg);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary); }
    .counter { font-size: 14px; font-weight: 600; color: var(--text-muted); }
    .dots { display: flex; gap: 6px; justify-content: center; margin-top: 15px; }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active { background: #38bdf8; transform: scale(1.25); }
    .meta-card {
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      margin-top: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .meta-card h3 { font-size: 18px; margin-bottom: 12px; color: #38bdf8; }
    .meta-card ul { list-style: none; font-size: 14px; color: var(--text-muted); line-height: 1.7; }
    .meta-card ul li strong { color: var(--text); }
    .links { margin-top: 16px; display: flex; gap: 12px; }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="badge">인스타그램 카드뉴스</div>
    <h1>매장 2곳 직원 총 6명, 상시 5인 이상일까?</h1>
    <p class="desc">사업장 구분 기준과 근로기준법 시행령 제7조의2 '1/2 규정' 완벽 해설</p>
  </header>

  <div class="viewer-container">
    <div class="slider" id="slider">
      <div class="slide"><img src="output/card_01.png" alt="카드 1 - 표지" /></div>
      <div class="slide"><img src="output/card_02.png" alt="카드 2 - 사업장 구분" /></div>
      <div class="slide"><img src="output/card_03.png" alt="카드 3 - 상시근로자 계산 원리" /></div>
      <div class="slide"><img src="output/card_04.png" alt="카드 4 - 1/2 규정 사례 A" /></div>
      <div class="slide"><img src="output/card_05.png" alt="카드 5 - 1/2 규정 사례 B" /></div>
      <div class="slide"><img src="output/card_06.png" alt="카드 6 - 급여 영향" /></div>
      <div class="slide"><img src="output/card_07.png" alt="카드 7 - 엔딩 및 솔루션" /></div>
    </div>
    <div class="controls">
      <button class="btn" id="prevBtn">‹ 이전</button>
      <div class="counter" id="counter">1 / 7</div>
      <button class="btn" id="nextBtn">다음 ›</button>
    </div>
  </div>

  <div class="dots" id="dotsContainer"></div>

  <div class="meta-card">
    <h3>📱 알바급여정석 솔루션 안내</h3>
    <ul>
      <li><strong>핵심 요약:</strong> 등록 직원 수가 아닌 실제 날짜별 근무 인원과 1/2 규정이 결정</li>
      <li><strong>솔루션:</strong> 직원별 근무표 작성, 출퇴근 기록, 상시 5인 판단 가이드 제공</li>
    </ul>
    <div class="links">
      <a class="link-btn" href="https://app.albapay.co.kr" target="_blank" rel="noopener">웹에서 바로 체험하기 ↗</a>
    </div>
  </div>

  <script>
    const slider = document.getElementById('slider');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const counter = document.getElementById('counter');
    const dotsContainer = document.getElementById('dotsContainer');
    let currentIndex = 0;

    slides.forEach((_, idx) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (idx === 0 ? ' active' : '');
      dot.addEventListener('click', () => scrollToSlide(idx));
      dotsContainer.appendChild(dot);
    });

    function updateState(idx) {
      currentIndex = idx;
      counter.textContent = `${idx + 1} / ${slides.length}`;
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === idx);
      });
    }

    function scrollToSlide(idx) {
      const target = slides[idx];
      slider.scrollTo({ left: target.offsetLeft, behavior: 'smooth' });
      updateState(idx);
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) scrollToSlide(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < slides.length - 1) scrollToSlide(currentIndex + 1);
    });

    slider.addEventListener('scroll', () => {
      const idx = Math.round(slider.scrollLeft / slider.offsetWidth);
      if (idx !== currentIndex && idx >= 0 && idx < slides.length) {
        updateState(idx);
      }
    });
  </script>
</body>
</html>
